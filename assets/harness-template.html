<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f5; overflow: hidden; height: 100vh; width: 100vw; color: #333;
    }

    /* ── Workspace bar ────────────────────────── */
    #workspace-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 150;
      height: 36px; display: flex; align-items: center; gap: 0;
      background: #1a1a1a; padding: 0 12px; display: none;
    }
    .ws-tab {
      padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
      color: #888; border: none; background: none; font-family: inherit;
      border-bottom: 2px solid transparent; transition: all 0.15s;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .ws-tab:hover { color: #ccc; }
    .ws-tab.active { color: #fff; border-bottom-color: #fff; }
    .ws-tab .ws-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #555; transition: background 0.3s;
    }
    .ws-tab.active .ws-dot { background: #22c55e; }
    .ws-tab .ws-badge {
      font-size: 10px; background: #ef4444; color: #fff; padding: 0 5px;
      border-radius: 8px; min-width: 16px; text-align: center;
      animation: badgePop 0.3s ease-out;
    }
    @keyframes badgePop { from { transform: scale(0); } to { transform: scale(1); } }

    body.has-workspaces #workspace-bar { display: flex; }
    body.has-workspaces .slide { padding-top: 92px; }
    body.has-workspaces #counter { top: 52px; }
    body.has-workspaces #sessions { top: 52px; }
    body.has-workspaces #fit-btn { top: 52px; }
    body.has-workspaces #submit-btn { top: 52px; }

    /* ── Top bar ─────────────────────────────── */
    #counter {
      position: fixed; top: 16px; left: 20px; z-index: 100;
      font-size: 14px; font-weight: 600; color: #666;
      background: rgba(255,255,255,0.92); padding: 5px 14px; border-radius: 20px;
      backdrop-filter: blur(8px); box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .counter-number { color: #111; font-size: 16px; margin-right: 2px; }
    .counter-pos { color: #aaa; font-weight: 400; font-size: 12px; margin-left: 6px; }
    #sessions {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 100;
      display: flex; gap: 4px;
    }
    .session-pill {
      padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
      border: 1px solid #ddd; background: rgba(255,255,255,0.92); cursor: pointer;
      backdrop-filter: blur(8px); color: #888; transition: all 0.2s;
    }
    .session-pill.active { background: #333; color: #fff; border-color: #333; }
    .session-pill:hover { border-color: #999; }
    #submit-btn {
      position: fixed; top: 16px; right: 20px; z-index: 100;
      font-size: 12px; cursor: pointer; background: #22c55e;
      padding: 0 16px; height: 34px; border-radius: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: none; transition: all 0.15s;
      color: #fff; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    #submit-btn:hover { background: #16a34a; }
    #submit-btn:active { transform: scale(0.95); }
    #submit-btn.done { background: #333; }
    #fit-btn {
      position: fixed; top: 16px; right: 120px; z-index: 100;
      font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.92);
      padding: 0 14px; height: 34px; border-radius: 20px; backdrop-filter: blur(8px);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: none; transition: all 0.15s;
      color: #888; font-weight: 500; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
    }
    #fit-btn:active { transform: scale(0.9); }
    #fit-btn.active { background: #333; color: #fff; }

    /* ── Carousel ────────────────────────────── */
    #carousel {
      display: flex; height: calc(100vh - var(--review-bar-height, 120px));
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide {
      min-width: 100vw; height: 100%; display: flex; justify-content: center;
      overflow-y: auto; padding: 56px 32px 32px;
    }
    body.fit-mode .slide {
      overflow: hidden; align-items: flex-start; padding-top: 48px; padding-bottom: 0;
    }
    /* Full-screen view (W): the mockup fills the window width and scrolls its full
       length natively — for reviewing wide, long, page-scale designs at real size. */
    body.full-mode .slide { padding: 0; }
    body.full-mode .slide-inner {
      max-width: none; width: 100vw; border-radius: 0; box-shadow: none; border-top: 0;
    }
    body.full-mode .slide-label { display: none; }
    .slide-inner {
      max-width: min(1480px, 95vw); width: 100%; background: #fff; border-radius: 12px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.06); position: relative;
      border-top: 4px solid transparent; transition: border-color 0.25s, transform 0.25s;
      height: fit-content; transform-origin: top center; overflow: hidden;
    }
    .slide-inner.liked { border-top-color: #22c55e; }
    .slide-inner.disliked { border-top-color: #ef4444; }
    .slide-label {
      font-size: 13px; font-weight: 600; color: #999; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 16px 24px 12px; margin: 0;
      border-bottom: 1px solid #eee;
      display: flex; align-items: center;
    }
    .slide-content iframe {
      width: 100%; border: none; display: block; min-height: max(600px, 80vh);
    }

    /* ── Bottom bar ──────────────────────────── */
    #bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,0.94); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0,0,0,0.06); padding: 10px 24px 12px;
    }
    #bottom-inner {
      max-width: 900px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
    }
    .vote-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid #e8e8e8;
      background: white; font-size: 15px; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .vote-btn:hover { border-color: #ccc; background: #fafafa; }
    .vote-btn.active-up { border-color: #22c55e; background: #f0fdf4; }
    .vote-btn.active-down { border-color: #ef4444; background: #fef2f2; }

    #notes {
      flex: 1; min-width: 0; resize: none; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 7px 12px; font-size: 14px; font-family: inherit;
      height: 34px; max-height: 100px; line-height: 1.4;
      background: white; color: #333; outline: none; transition: border-color 0.2s;
    }
    #notes:focus { border-color: #666; }
    #notes::placeholder { color: #bbb; }
    #notes.streaming { border-color: #ef4444; background: #fef8f8; }

    #mic-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid #e8e8e8;
      background: white; font-size: 14px; cursor: default; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; position: relative;
    }
    #mic-btn.recording { border-color: #ef4444; background: #fef2f2; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    #mic-btn.recording { animation: pulse 1.2s ease-in-out infinite; }

    #waveform {
      pointer-events: none;
      position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
      width: 200px; height: 40px; border-radius: 10px;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.06);
      opacity: 0; transition: opacity 0.2s; z-index: 101;
    }
    #waveform.active { opacity: 1; }

    /* ── Help overlay ────────────────────────── */
    #help-btn {
      position: fixed; bottom: 60px; right: 20px; z-index: 100;
      width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #ddd;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
      font-size: 13px; color: #aaa; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-weight: 600;
      transition: all 0.15s;
    }
    #help-btn:hover { border-color: #999; color: #666; }
    #shortcuts-overlay {
      position: fixed; bottom: 96px; right: 20px; z-index: 200;
      background: rgba(30,30,30,0.92); backdrop-filter: blur(12px);
      border-radius: 12px; padding: 16px 20px;
      display: none; min-width: 200px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #shortcuts-overlay.visible { display: block; }
    .sc-row { display: flex; justify-content: space-between; gap: 24px; padding: 4px 0; }
    .sc-key { font-size: 12px; color: #999; }
    .sc-key kbd {
      display: inline-block; background: rgba(255,255,255,0.12); padding: 1px 6px;
      border-radius: 4px; font-family: inherit; font-size: 11px; color: #ccc;
      border: 1px solid rgba(255,255,255,0.08); min-width: 20px; text-align: center;
    }
    .sc-label { font-size: 12px; color: #888; }

    /* ── Empty state ─────────────────────────── */
    #empty-state {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #bbb;
    }
    #empty-state h2 { font-weight: 400; font-size: 20px; margin-bottom: 6px; }
    #empty-state p { font-size: 14px; }
    #review-header {position:fixed;top:0;left:0;right:0;z-index:110;background:#f5f5f5ee;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;backdrop-filter:blur(10px)}
    body.has-workspaces #review-header {top:36px}
    #review-header #counter,#review-header #sessions,#review-header #fit-btn,#review-header #submit-btn {position:static;transform:none}
    #review-header #counter {font-size:12px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #review-header #sessions {flex:1;overflow-x:auto;white-space:nowrap}
    #review-question {width:100%;font-size:13px;color:#555;line-height:1.4}
    .slide,body.has-workspaces .slide {padding-top:120px;padding-bottom:190px;overflow-x:auto}
    .slide-inner {flex-shrink:0}
    #review-tools {display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;font-size:12px}
    #review-tools button,#review-tools select {font:inherit;border:1px solid #ddd;border-radius:6px;background:#fff;padding:5px 9px;color:#555}
    #review-tools button[aria-pressed="true"] {background:#333;color:#fff}
    #review-status {color:#777;min-height:16px;font-size:12px;text-align:center;margin-top:6px}
    #review-status.error {color:#b42318}
    .slide-content.side-by-side {display:flex;gap:16px;align-items:flex-start}
    .slide-content iframe {flex-shrink:0}
    @media(max-width:700px){#review-header #counter{max-width:100%;flex:1}#review-header #sessions{order:4;flex-basis:100%}.slide,body.has-workspaces .slide{padding-left:8px;padding-right:8px;padding-top:156px}#review-tools{gap:4px}#review-question{font-size:12px}}
  </style>
</head>
<body>
  <div id="workspace-bar"></div>
  <header id="review-header"><div id="counter"></div>
  <div id="sessions"></div>
  <button id="fit-btn" title="Fit to window (F)">Fit</button>
  <button id="submit-btn" title="Submit feedback (C)">Submit</button><div id="review-question"></div></header>

  <div id="carousel"></div>

  <div id="empty-state">
    <h2>Waiting for mockups…</h2>
    <p>HTML files in the mockup directory will appear here</p>
  </div>

  <div id="bottom-bar" style="display:none">
    <div id="review-tools">
      <label>Width <select id="viewport"><option value="default">Product</option><option value="auto">Window</option><option value="390">390</option><option value="768">768</option><option value="1280">1280</option></select></label>
      <button id="pin-btn" title="Keep this version as a comparison reference">Pin</button>
      <label>Reference <select id="reference"><option value="">Choose…</option></select></label>
      <button id="compare-btn" title="Switch A/B at the same width (A)" disabled>A/B</button>
      <button id="side-btn" title="Compare at fixed widths side by side" disabled>Side by side</button>
      <button id="point-btn" title="Click a preview element to anchor your note">Point and note</button>
    </div>
    <div id="bottom-inner">
      <button class="vote-btn" id="btn-up" title="Like (↑)">👍</button>
      <button class="vote-btn" id="btn-neutral" title="Reviewed, no preference">—</button>
      <button class="vote-btn" id="btn-down" title="Dislike (↓)">👎</button>
      <textarea id="notes" placeholder="Notes… (Tab to focus)" rows="1"></textarea>
      <div id="mic-btn" title="Hold Space to record">🎤</div>
    </div>
    <div id="review-status" role="status" aria-live="polite"></div>
    <canvas id="waveform" width="200" height="40"></canvas>
  </div>

  <div id="help-btn" title="Keyboard shortcuts (?)">?</div>
  <div id="shortcuts-overlay">
    <div class="sc-row"><span class="sc-key"><kbd>←</kbd> <kbd>→</kbd></span><span class="sc-label">Navigate</span></div>
    <div class="sc-row"><span class="sc-key"><kbd>↑</kbd> <kbd>↓</kbd></span><span class="sc-label">Like / Dislike</span></div>
    <div class="sc-row sc-voice"><span class="sc-key">Hold <kbd>Space</kbd></span><span class="sc-label">Voice note</span></div>
    <div class="sc-row"><span class="sc-key"><kbd>Tab</kbd></span><span class="sc-label">Focus notes</span></div>
    <div class="sc-row"><span class="sc-key"><kbd>F</kbd></span><span class="sc-label">Fit to window</span></div>
    <div class="sc-row"><span class="sc-key"><kbd>C</kbd></span><span class="sc-label">Submit feedback</span></div>
    <div class="sc-row"><span class="sc-key"><kbd>A</kbd></span><span class="sc-label">Switch comparison</span></div>
    <div class="sc-row"><span class="sc-key">Alt + arrows</span><span class="sc-label">Review inside preview</span></div>
    <div class="sc-row"><span class="sc-key"><kbd>?</kbd></span><span class="sc-label">This help</span></div>
  </div>

  <script>
    /*__SONIOX_KEY_INJECT__*/

    // ── State ────────────────────────────────────
    const mockups = [];     // [{id, label, contentHtml, session, workspace, vote, notes}]
    let currentIndex = 0;   // index into visible mockups
    let currentSession = null;
    const sessionLabels = new Map(); // `${workspace}:${id}` → label
    let currentWorkspace = new URLSearchParams(location.search).get('workspace'); // workspace ID or null (show all)
    let knownWorkspaces = [];    // [{id, projectName, branch, mockups, lastActive}]
    let notesActive = false;
    let recording = false;
    let hasUserSelectedSession = false;
    let initialized = false;
    const briefs = new Map();
    const drafts = new Map();
    const saveTimers = new Map();
    const pendingWorkspaces = new Set();
    let pinned = null, comparison = null, compareMode = false, sideMode = false, pointMode = false;
    let comparisonGeneration = 0;
    const identity = m => `${m.workspace}:${m.id}`;
    const draftKey = m => `${identity(m)}:r${m.revision}`;

    // ── DOM refs ─────────────────────────────────
    const $ = (s) => document.getElementById(s);
    const carousel    = $('carousel');
    const counterEl   = $('counter');
    const sessionsEl  = $('sessions');
    const emptyState  = $('empty-state');
    const bottomBar   = $('bottom-bar');
    const notesEl     = $('notes');
    const btnUp       = $('btn-up');
    const btnDown     = $('btn-down');
    const waveform    = $('waveform');
    const micBtn      = $('mic-btn');
    const submitBtn   = $('submit-btn');
    const helpBtn     = $('help-btn');
    const helpOverlay = $('shortcuts-overlay');
    const workspaceBar = $('workspace-bar');
    const neutralBtn = $('btn-neutral');
    const statusEl = $('review-status');
    const referenceEl = $('reference');
    const viewportEl = $('viewport');
    new ResizeObserver(() => {
      document.documentElement.style.setProperty('--review-bar-height', bottomBar.getBoundingClientRect().height + 'px');
      if (fitMode) applyFitScale();
    }).observe(bottomBar);
    // ── Helpers ──────────────────────────────────
    function visible() {
      let filtered = mockups;
      if (currentWorkspace !== null) filtered = filtered.filter(m => m.workspace === currentWorkspace);
      if (currentSession !== null) filtered = filtered.filter(m => m.session === currentSession);
      return [...filtered].sort((a, b) => a.number - b.number);
    }

    function visibleIndices() {
      const v = visible();
      return v.map(m => mockups.indexOf(m));
    }

    function currentMockup() {
      return visible()[currentIndex] || null;
    }

    // ── Iframe harness for mockup isolation ─────────
    function buildIframeSrc(contentHtml, mockupId) {
      const scr = 'script';
      return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;padding:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}</style>
<${scr} src="https://cdn.tailwindcss.com"></${scr}>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<${scr} src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></${scr}>
</head><body>
${contentHtml}
<${scr}>(function(){
if(window.lucide)try{lucide.createIcons()}catch(e){}
// Close dialog forms locally; sandboxed previews cannot submit forms.
document.addEventListener("click",function(e){if(e.defaultPrevented)return;var button=e.target.closest("button,input[type=submit]");if(!button||button.type!=="submit")return;var form=button.form,method=button.getAttribute("formmethod")||form?.getAttribute("method");if(!form||method?.toLowerCase()!=="dialog")return;var dialog=form.closest("dialog");if(!dialog)return;e.preventDefault();if(form.noValidate||button.formNoValidate||form.reportValidity())dialog.close(button.value)});
var id=${JSON.stringify(mockupId)};
function report(){parent.postMessage({type:"mockup-resize",id:id,height:document.documentElement.scrollHeight},"*")}
new ResizeObserver(report).observe(document.documentElement);
window.addEventListener("load",report);
var point=false,scrollTimer;
window.addEventListener("message",function(e){if(e.source!==parent)return;if(e.data?.type==="review-point-mode")point=e.data.enabled;if(e.data?.type==="review-scroll")window.scrollTo(e.data.x||0,e.data.y||0)});
document.addEventListener("click",function(e){if(!point)return;e.preventDefault();e.stopImmediatePropagation();var el=e.target.closest("[data-region]")||e.target;parent.postMessage({type:"review-point",id:id,region:el.dataset.region||el.getAttribute("aria-label")||el.tagName.toLowerCase(),text:(el.innerText||el.textContent||"").trim().slice(0,120)},"*")},true);
document.addEventListener("keydown",function(e){if(e.altKey&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();parent.postMessage({type:"review-key",id:id,key:e.key},"*")}});
window.addEventListener("scroll",function(){clearTimeout(scrollTimer);scrollTimer=setTimeout(function(){parent.postMessage({type:"review-scroll",id:id,x:scrollX,y:scrollY},"*")},100)});

var n=0,t=setInterval(function(){report();if(++n>=20)clearInterval(t)},200);
})()</${scr}>
</body></html>`;
    }

    // ── Carousel navigation ──────────────────────
    function goTo(idx) {
      const vi = visibleIndices();
      if (vi.length === 0) return;
      idx = Math.max(0, Math.min(idx, vi.length - 1));
      currentIndex = idx;
      carousel.style.transform = `translateX(-${vi[idx] * 100}vw)`;
      closeComparison();
      markSeen(currentMockup());
      updateUI();
      refreshReferences();
    }

    function navigate(dir) { if(recording)return; hasUserSelectedSession=true; goTo(currentIndex + dir); }

    function addSlide(mockup) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.id = identity(mockup);

      const inner = document.createElement('div');
      inner.className = 'slide-inner';

      const label = document.createElement('div');
      label.className = 'slide-label';
      const labelSpan = document.createElement('span');
      labelSpan.textContent = `#${mockup.number} · ${mockup.label}`;
      label.appendChild(labelSpan);

      const content = document.createElement('div');
      content.className = 'slide-content';
      const iframe = document.createElement('iframe');
      // No allow-same-origin: mockup scripts get an opaque origin and cannot reach
      // this page, its Soniox key, or the server's endpoints.
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.dataset.mockupId = identity(mockup);
      iframe.onload = () => iframe.contentWindow?.postMessage({type:'review-point-mode',enabled:pointMode},'*');
      iframe.srcdoc = buildIframeSrc(mockup.contentHtml, identity(mockup));
      content.appendChild(iframe);

      inner.appendChild(label);
      inner.appendChild(content);
      slide.appendChild(inner);
      carousel.appendChild(slide);
    }

    // ── UI update ────────────────────────────────
    function updateUI() {
      const vis = visible();
      const hasSlides = vis.length > 0;

      emptyState.style.display = hasSlides ? 'none' : 'block';
      bottomBar.style.display = hasSlides ? 'block' : 'none';
      const m = currentMockup();
      counterEl.innerHTML = '';
      if (m) {
        // The design's own number, not its position, so spoken feedback maps to one mockup.
        const num = document.createElement('span');
        num.className = 'counter-number';
        num.textContent = `#${m.number}`;
        const pos = document.createElement('span');
        pos.className = 'counter-pos';
        pos.textContent = `r${m.revision} · ${currentIndex + 1}/${vis.length}`;
        counterEl.append(num, ` ${m.label} `, pos);
      }

      updateReviewBrief();
      if (!m) return;
      neutralBtn.className = 'vote-btn' + (m.vote === 'neutral' ? ' active-up' : '');
      notesEl.disabled = btnUp.disabled = btnDown.disabled = neutralBtn.disabled = compareMode;

      // Vote buttons
      btnUp.className = 'vote-btn' + (m.vote === 'up' ? ' active-up' : '');
      btnDown.className = 'vote-btn' + (m.vote === 'down' ? ' active-down' : '');

      // Notes
      if (!recording) {
        notesEl.value = m.notes || '';
        autoResize();
      }

      // Slide border states
      const slides = carousel.querySelectorAll('.slide');
      mockups.forEach((mk, i) => {
        if (!slides[i]) return;
        const inner = slides[i].querySelector('.slide-inner');
        inner.classList.toggle('liked', mk.vote === 'up');
        inner.classList.toggle('disliked', mk.vote === 'down');
      });

      if (fitMode) applyFitScale();
    }

    // ── Voting ───────────────────────────────────
    function vote(dir) {
      const m = currentMockup();
      if (!m || compareMode || recording) return;
      hasUserSelectedSession = true;
      m.vote = m.vote === dir ? null : dir;
      queueDraft(m);
      updateUI();
    }

    btnUp.onclick = () => vote('up');
    btnDown.onclick = () => vote('down');
    neutralBtn.onclick = () => vote('neutral');

    // ── Notes ────────────────────────────────────
    function autoResize() {
      notesEl.style.height = 'auto';
      notesEl.style.height = Math.min(notesEl.scrollHeight, 100) + 'px';
    }

    notesEl.addEventListener('input', () => {
      const m = currentMockup();
      if (m) {m.notes = notesEl.value;hasUserSelectedSession=true;queueDraft(m);}
      autoResize();
    });
    notesEl.addEventListener('focus', () => { notesActive = true; });
    notesEl.addEventListener('blur', () => { notesActive = false; });

    // ── Keyboard ─────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (notesActive && e.key !== 'Escape') return;

      switch (e.key) {
        case 'ArrowLeft':  e.preventDefault(); navigate(-1); break;
        case 'ArrowRight': e.preventDefault(); navigate(1); break;
        case 'ArrowUp':    e.preventDefault(); vote('up'); break;
        case 'ArrowDown':  e.preventDefault(); vote('down'); break;
        case ' ':
          e.preventDefault();
          if (!recording) startRecording();
          break;
        case 'Tab':
          e.preventDefault();
          notesEl.focus();
          break;
        case 'Escape':
          e.preventDefault();
          notesEl.blur();
          break;
        case 'a': case 'A':
          e.preventDefault(); toggleComparison(); break;
        case 'f': case 'F':
          if (!notesActive) { e.preventDefault(); toggleFit(); }
          break;
        case 'w': case 'W':
          if (!notesActive) { e.preventDefault(); toggleFull(); }
          break;
        case 'c': case 'C':
          if (!notesActive) { e.preventDefault(); submitFeedback(); }
          break;
        case '?':
          if (!notesActive) { e.preventDefault(); toggleHelp(); }
          break;
      }
    });

    function toggleHelp() {
      helpOverlay.classList.toggle('visible');
    }
    helpBtn.onclick = toggleHelp;
    document.addEventListener('click', (e) => {
      if (!helpBtn.contains(e.target) && !helpOverlay.contains(e.target)) {
        helpOverlay.classList.remove('visible');
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === ' ' && recording) {
        e.preventDefault();
        stopRecording();
      }
    });

    // ── Fit mode ──────────────────────────────────
    const fitBtn = $('fit-btn');
    let fitMode = false;

    function toggleFit() {
      fitMode = !fitMode;
      document.body.classList.toggle('fit-mode', fitMode);
      fitBtn.classList.toggle('active', fitMode);
      fitBtn.textContent = fitMode ? 'Fit ✓' : 'Fit';
      // Reset scroll positions
      carousel.querySelectorAll('.slide').forEach(s => s.scrollTop = 0);
      applyFitScale();
    }

    function applyFitScale() {
      const slides = carousel.querySelectorAll('.slide');
      slides.forEach(slide => {
        const inner = slide.querySelector('.slide-inner');
        if (!inner) return;
        if (!fitMode) { inner.style.transform = ''; return; }
        // offsetHeight/offsetWidth give layout size unaffected by CSS transforms —
        // no need to reset transform (which caused a flash during carousel transitions)
        const naturalH = inner.offsetHeight;
        const naturalW = inner.offsetWidth;
        const availH = carousel.clientHeight - 100;
        const availW = window.innerWidth - 64;
        const scaleH = naturalH > availH ? availH / naturalH : 1;
        const scaleW = naturalW > availW ? availW / naturalW : 1;
        const scale = Math.min(scaleH, scaleW);
        inner.style.transform = scale < 0.98 ? `scale(${scale})` : '';
      });
    }

    fitBtn.onclick = toggleFit;
    window.addEventListener('resize', () => { if (fitMode) applyFitScale(); });

    // ── Full-screen view (W) — fill the window, scroll the full length ──
    let fullMode = false;
    function toggleFull() {
      fullMode = !fullMode;
      document.body.classList.toggle('full-mode', fullMode);
      if (fullMode && fitMode) toggleFit();           // the two modes are exclusive
      carousel.querySelectorAll('.slide').forEach(s => s.scrollTop = 0);
    }

    // ── Submit feedback (write to file + clipboard) ──
    function buildFeedbackText() {
      const vis = visible();
      const sections = [];
      // Header with workspace info
      const ws = knownWorkspaces.find(w => w.id === currentWorkspace);
      if (ws) {
        const sessionLabel = currentSession !== null ? ` — Round ${currentSession}` : '';
        sections.push(`# Feedback — ${ws.id} (${ws.projectName}, ${ws.branch})${sessionLabel}\n# Submitted: ${new Date().toISOString()}`);
      }
      for (const m of vis) {
        const vote = m.vote === 'up' ? '👍' : m.vote === 'down' ? '👎' : m.vote === 'neutral' ? 'reviewed, no preference' : '—';
        const hasNotes = m.notes && m.notes.trim();
        if (!hasNotes && !m.vote) continue;
        let section = `### #${m.number} ${m.label} (${m.id}, revision ${m.revision})  [${vote}]`;
        if (hasNotes) section += '\n' + m.notes.trim();
        sections.push(section);
      }
      for (const [seen, label] of [[true, 'Viewed, no verdict'], [false, 'Not reviewed']]) {
        const items = vis.filter(m => !!m.seen === seen && !m.vote && !m.notes.trim());
        if(items.length) sections.push(`### ${label}\n` + items.map(m=>`- #${m.number} ${m.label} (${m.id}, revision ${m.revision})`).join('\n'));
      }
      return sections.join('\n\n').trim();
    }

    async function submitFeedback() {
      if (recording) return;
      const wsId = currentWorkspace;
      if (!wsId) return;
      submitBtn.disabled = true;
      try {
        await Promise.all(visible().map(saveDraft));
        const text = buildFeedbackText();
        const result = await api(`/workspace/${encodeURIComponent(wsId)}/feedback`, {content:text,session:currentSession});
        try {await navigator.clipboard.writeText(text)} catch {}
        submitBtn.textContent = 'Submitted ✓';
        setStatus(`Round ${result.round} feedback saved.`, false);
        setTimeout(()=>{submitBtn.textContent='Submit'},2000);
      } catch(error) {setStatus(`Feedback was not submitted: ${error.message}. Your notes are retained; retry Submit.`,true)}
      finally {submitBtn.disabled=false}
    }

    submitBtn.onclick = submitFeedback;

    function flash(msg) {
      micBtn.title = msg;
      micBtn.style.borderColor = '#c4763c';
      setTimeout(() => { micBtn.style.borderColor = ''; updateVoiceStatus(); }, 2000);
    }

    const voiceEnabled = !!window.__SONIOX_KEY;

    function updateVoiceStatus() {
      if (!voiceEnabled) {
        micBtn.style.display = 'none';
        return;
      }
      if (!audioReady) micBtn.title = 'Mic unavailable';
      else if (!sonioxWs || sonioxWs.readyState !== WebSocket.OPEN) micBtn.title = 'Voice connecting…';
      else micBtn.title = 'Hold Space to record';
    }

    // ── Audio / Soniox voice ─────────────────────
    let audioCtx, analyser, mediaStream, sourceNode, scriptNode, sonioxWs;
    let audioReady = false;
    let transcript = { final: '', nonfinal: '' };
    let preRecordingNotes = '';
    let recordingTarget = null;
    let finalizingRecording = false;
    let keepaliveTimer;
    let barHeights = new Float32Array(24);

    async function initAudio() {
      if (!voiceEnabled) return;
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        audioReady = true;
      } catch (err) {
        console.error('Mic init failed:', err);
      }
    }

    function connectSoniox() {
      if (!voiceEnabled) return;

      sonioxWs = new WebSocket('wss://stt-rt.soniox.com/transcribe-websocket');

      sonioxWs.onopen = () => {
        sonioxWs.send(JSON.stringify({
          api_key: window.__SONIOX_KEY,
          model: 'stt-rt-preview',
          audio_format: 'pcm_s16le',
          sample_rate: 16000,
          num_channels: 1,
          language_hints: ['en'],
        }));
        keepaliveTimer = setInterval(() => {
          if (sonioxWs.readyState === WebSocket.OPEN && !recording) {
            sonioxWs.send(new Int16Array(160).buffer);
          }
        }, 10000);
        updateVoiceStatus();
      };

      sonioxWs.onmessage = (e) => {
        try { handleSonioxMsg(JSON.parse(e.data)); }
        catch (err) { console.warn('Soniox parse:', err, e.data); }
      };

      sonioxWs.onerror = (err) => console.error('Soniox error:', err);
      sonioxWs.onclose = () => {
        clearInterval(keepaliveTimer);
        updateVoiceStatus();
        setTimeout(connectSoniox, 3000);
      };
    }

    function cleanToken(text) {
      return text.replace(/<\/?fin>/gi, '').replace(/<[^>]*>/g, '');
    }

    function handleSonioxMsg(data) {
      if (data.finished) return;
      if (data.tokens) {
        let nft = '';
        for (const tok of data.tokens) {
          const text = cleanToken(tok.text);
          if (!text) continue;
          if (tok.is_final) transcript.final += text;
          else nft += text;
        }
        transcript.nonfinal = nft;
      }
      streamToTextarea();
    }

    function streamToTextarea() {
      const m = recordingTarget;
      if (!m || !recording) return;
      const streamed = (transcript.final + transcript.nonfinal).trim();
      m.notes = preRecordingNotes + (preRecordingNotes && streamed ? '\n' : '') + streamed;
      showRecordingNotes(m);
      queueDraft(m);
    }

    function showRecordingNotes(m) {
      const active = currentMockup();
      if (!active || draftKey(active) !== draftKey(m)) return;
      active.notes = m.notes;
      notesEl.value = m.notes;
      autoResize();
      notesEl.scrollTop = notesEl.scrollHeight;
    }

    function startRecording() {
      if (compareMode || finalizingRecording || !currentMockup()) return;
      if (!audioReady) { flash('Mic not available — allow mic access and reload'); return; }
      if (!sonioxWs || sonioxWs.readyState !== WebSocket.OPEN) { flash('Voice connecting…'); return; }
      recording = true;
      transcript = { final: '', nonfinal: '' };
      barHeights.fill(0);
      const m = currentMockup();
      recordingTarget = {...m};
      preRecordingNotes = m ? (m.notes || '').trimEnd() : '';

      micBtn.classList.add('recording');
      waveform.classList.add('active');
      notesEl.classList.add('streaming');

      if (audioCtx.state === 'suspended') audioCtx.resume();

      sourceNode = audioCtx.createMediaStreamSource(mediaStream);
      scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

      const nativeSR = audioCtx.sampleRate;
      scriptNode.onaudioprocess = (e) => {
        if (!recording) return;
        e.outputBuffer.getChannelData(0).fill(0);
        const input = e.inputBuffer.getChannelData(0);
        const pcm16 = downsample(input, nativeSR, 16000);
        if (sonioxWs.readyState === WebSocket.OPEN) {
          sonioxWs.send(pcm16.buffer);
        }
      };

      sourceNode.connect(analyser);
      sourceNode.connect(scriptNode);
      scriptNode.connect(audioCtx.destination);

      drawWaveform();
    }

    function stopRecording() {
      if (!recording) return;
      recording = false;
      finalizingRecording = true;
      const target = recordingTarget;
      const previousNotes = preRecordingNotes;
      micBtn.classList.remove('recording');
      waveform.classList.remove('active');
      notesEl.classList.remove('streaming');

      if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
      if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }

      if (sonioxWs && sonioxWs.readyState === WebSocket.OPEN) {
        sonioxWs.send(JSON.stringify({ type: 'finalize' }));
      }

      // Wait for final tokens, then commit
      setTimeout(() => {
        const text = (transcript.final + transcript.nonfinal).trim();
        const m = target;
        if (m) {
          m.notes = previousNotes + (previousNotes && text ? '\n' : '') + text;
          showRecordingNotes(m);
          queueDraft(m);
        }
        recordingTarget = null;
        finalizingRecording = false;
      }, 600);
    }

    function downsample(input, fromRate, toRate) {
      const ratio = fromRate / toRate;
      const len = Math.floor(input.length / ratio);
      const out = new Int16Array(len);
      for (let i = 0; i < len; i++) {
        const s = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return out;
    }

    // ── Waveform visualization (frequency bars) ────
    function drawWaveform() {
      if (!recording) return;
      const ctx = waveform.getContext('2d');
      const W = 140, H = 36;
      const freqData = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freqData);

      ctx.clearRect(0, 0, W, H);

      const count = barHeights.length;
      const barW = 3, gap = (W - count * barW) / (count - 1);
      const binsPer = Math.floor(freqData.length / count);

      for (let i = 0; i < count; i++) {
        // Average frequency bins for this bar
        let sum = 0;
        for (let j = 0; j < binsPer; j++) sum += freqData[i * binsPer + j];
        const target = (sum / binsPer / 255) * H * 0.9;
        // Smooth: fast rise, slow fall
        barHeights[i] = target > barHeights[i]
          ? barHeights[i] * 0.3 + target * 0.7
          : barHeights[i] * 0.85 + target * 0.15;
        const bh = Math.max(2, barHeights[i]);
        const x = i * (barW + gap);
        const y = (H - bh) / 2;
        ctx.fillStyle = `rgba(239, 68, 68, ${0.4 + (bh / H) * 0.6})`;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, bh, 1.5);
        ctx.fill();
      }
      requestAnimationFrame(drawWaveform);
    }

    // ── SSE client ───────────────────────────────
    function connectSSE() {
      const es = new EventSource('/events');

      es.addEventListener('add', (e) => {
        const data = JSON.parse(e.data);
        addMockup(data);
        if (initialized && data.workspace !== currentWorkspace) {
          pendingWorkspaces.add(data.workspace);
          updateWorkspaceTabs();
        }
      });
      es.addEventListener('update', (e) => updateMockupContent(JSON.parse(e.data)));
      es.addEventListener('remove', (e) => removeMockup(JSON.parse(e.data)));
      es.addEventListener('workspaces', (e) => {
        knownWorkspaces = JSON.parse(e.data);
        if (knownWorkspaces.length > 0 && !knownWorkspaces.some(w=>w.id===currentWorkspace)) {
          currentWorkspace = knownWorkspaces[0].id;
        }
        updateWorkspaceTabs();
      });
      es.addEventListener('workspace-add', (e) => {
        const ws = JSON.parse(e.data);
        if (!knownWorkspaces.find(w => w.id === ws.id)) {
          knownWorkspaces.push(ws);
          // Auto-select first workspace, show badge on others
          if (knownWorkspaces.length === 1) currentWorkspace = ws.id;
        }
        updateWorkspaceTabs();
      });
      es.addEventListener('workspace-remove', (e) => {
        const { id } = JSON.parse(e.data);
        knownWorkspaces = knownWorkspaces.filter(w => w.id !== id);
        if (currentWorkspace === id) {
          currentWorkspace = knownWorkspaces.length > 0 ? knownWorkspaces[0].id : null;
          currentIndex = 0;
          goTo(0);
        }
        updateWorkspaceTabs();
      });
      es.addEventListener('init-complete', () => { initialized = true;markSeen(currentMockup());refreshReferences(); });
      es.addEventListener('brief',e=>{const data=JSON.parse(e.data);briefs.set(data.workspace,data.brief);if(data.drafts){for(const review of Object.values(data.drafts)){drafts.set(`${data.workspace}:${review.id}:r${review.revision}`,review)}}for(const m of mockups.filter(m=>m.workspace===data.workspace))restoreDraft(m);updateReviewBrief();updateUI();});
      es.addEventListener('draft',e=>{const data=JSON.parse(e.data);const key=`${data.workspace}:${data.review.id}:r${data.review.revision}`;drafts.set(key,data.review);const m=mockups.find(m=>draftKey(m)===key);if(m&&!m.pendingSave){restoreDraft(m);updateUI()}});
      es.addEventListener('workspace-error',e=>{const data=JSON.parse(e.data);if(data.workspace===currentWorkspace)setStatus(data.error,true)});
      es.addEventListener('session-closed', () => {});
      es.addEventListener('session', (e) => {
        const data = JSON.parse(e.data);
        const key = `${data.workspace}:${data.id}`;
        // A new round takes focus once its mockups arrive.
        if (initialized && !sessionLabels.has(key) && hasUserSelectedSession && data.workspace===currentWorkspace) setStatus(`New round ${data.id} is available in the round tabs.`);
        sessionLabels.set(key, data.label || '');
        // Update mockup session assignments
        if (data.mockups) {
          for (const mockupId of data.mockups) {
            const m = mockups.find(mk => mk.id === mockupId && mk.workspace === data.workspace);
            if (m) m.session = data.id;
          }
        }
        updateSessionPills();
      });

      es.onerror = () => { es.close(); setTimeout(connectSSE, 2000); };
    }

    // ── Workspace tabs ────────────────────────────
    function updateWorkspaceTabs() {
      const multi = knownWorkspaces.length > 1;
      document.body.classList.toggle('has-workspaces', multi);

      if (!multi) {
        workspaceBar.innerHTML = '';
        // Update title with single workspace name
        if (knownWorkspaces.length === 1) {
          const ws = knownWorkspaces[0];
          document.title = `${ws.projectName} (${ws.branch}) — Design Explorer`;
        }
        return;
      }

      workspaceBar.innerHTML = '';
      for (const ws of knownWorkspaces) {
        const tab = document.createElement('button');
        tab.className = 'ws-tab' + (currentWorkspace === ws.id ? ' active' : '');

        const dot = document.createElement('span');
        dot.className = 'ws-dot';
        tab.appendChild(dot);
        if(pendingWorkspaces.has(ws.id)){const badge=document.createElement('span');badge.className='ws-badge';badge.textContent='New';tab.appendChild(badge)}

        tab.appendChild(document.createTextNode(ws.id));
        tab.title = `${ws.projectName} (${ws.branch}) — ${ws.mockupDir}`;

        tab.onclick = () => {
          if (currentWorkspace === ws.id) return;
          if(recording)return;
          currentWorkspace = ws.id;
          pendingWorkspaces.delete(ws.id);
          hasUserSelectedSession=false;
          currentSession = null;
          currentIndex = 0;
          goTo(0);
          updateWorkspaceTabs();
          updateSessionPills();
          document.title = `${ws.projectName} (${ws.branch}) — Design Explorer`;
        };
        workspaceBar.appendChild(tab);
      }

      const activeWs = knownWorkspaces.find(w => w.id === currentWorkspace);
      if (activeWs) {
        document.title = `${activeWs.projectName} (${activeWs.branch}) — Design Explorer`;
      }
    }

    function parseMockupHtml(html) {
      // A <template> parses inertly: unlike a detached <div>, handlers such as
      // <img onerror> never run in this page's origin.
      const div = document.createElement('template');
      div.innerHTML = html;
      const section = div.content.querySelector('.mockup-section') || div.content.querySelector('section');
      if (section) {
        const id = section.dataset.mockupId || '';
        const label = section.dataset.label ||
                      (section.querySelector('.mockup-label')?.textContent.trim()) ||
                      id;
        const content = section.querySelector('.mockup-content');
        if (content) return { id, label, contentHtml: content.innerHTML };
        // Simplified format: strip header if present, use remaining content
        const header = section.querySelector('.mockup-header');
        if (header) header.remove();
        return { id, label, contentHtml: section.innerHTML };
      }
      return { id: '', label: '', contentHtml: html };
    }

    function addMockup(data) {
      if (mockups.find(m => m.id === data.id && m.workspace === data.workspace)) {
        updateMockupContent(data);
        return;
      }

      const parsed = parseMockupHtml(data.html);
      const mockup = {
        id: data.id,
        label: parsed.label || data.id,
        contentHtml: parsed.contentHtml,
        session: data.session || 0,
        number: data.number || 0,
        revision: data.revision || 1,
        seen: false,
        workspace: data.workspace || null,
        vote: null,
        notes: '',
      };

      restoreDraft(mockup);
      mockups.push(mockup);
      addSlide(mockup);

      if (mockups.length === 1) goTo(0);
      else updateUI();
      updateSessionPills();
    }

    function updateMockupContent(data) {
      const idx = mockups.findIndex(m => m.id === data.id && m.workspace === data.workspace);
      if (idx < 0) return;
      const parsed = parseMockupHtml(data.html);
      const changed = data.revision !== mockups[idx].revision;
      const activeChanged=changed&&currentMockup()===mockups[idx];
      if(changed){mockups[idx].revision=data.revision;mockups[idx].vote=null;mockups[idx].notes='';mockups[idx].seen=false;mockups[idx].pendingSave=false;mockups[idx].clientUpdated=undefined;restoreDraft(mockups[idx]);if(activeChanged)closeComparison();}
      mockups[idx].contentHtml = parsed.contentHtml;
      mockups[idx].label = parsed.label || mockups[idx].label;
      if (data.session) mockups[idx].session = data.session;

      const slides = carousel.querySelectorAll('.slide');
      if (slides[idx]) {
        const iframe = slides[idx].querySelector('iframe');
        const label = slides[idx].querySelector('.slide-label');
        if (iframe) iframe.srcdoc = buildIframeSrc(parsed.contentHtml, identity(mockups[idx]));
        if (label) label.textContent = `#${mockups[idx].number} · ${mockups[idx].label}`;
      }
      updateUI();
      if (data.session) updateSessionPills();
      if(activeChanged){markSeen(currentMockup());refreshReferences()}
    }

    function removeMockup(data) {
      const id=data.id;
      const idx = mockups.findIndex(m => m.id === id && m.workspace === data.workspace);
      if (idx < 0) return;
      mockups.splice(idx, 1);
      const slides = carousel.querySelectorAll('.slide');
      if (slides[idx]) slides[idx].remove();

      if (currentIndex >= visible().length) {
        currentIndex = Math.max(0, visible().length - 1);
      }
      goTo(currentIndex);
      updateSessionPills();
    }

    // ── Sessions ─────────────────────────────────
    function updateSessionPills() {
      const wsMockups = currentWorkspace !== null
        ? mockups.filter(m => m.workspace === currentWorkspace) : mockups;
      const sessionIds = [...new Set(wsMockups.map(m => m.session).filter(Boolean))].sort((a,b) => a-b);
      if (sessionIds.length <= 1) {
        sessionsEl.innerHTML = '';
        currentSession = null;
        return;
      }

      // Auto-select latest session until user manually clicks a tab
      if (!hasUserSelectedSession && sessionIds.length > 1) {
        const latest = sessionIds[sessionIds.length - 1];
        if (currentSession !== latest) {
          currentSession = latest;
          currentIndex = 0;
          goTo(0);
        }
      }

      // Validate current session still exists
      if (currentSession !== null && !sessionIds.includes(currentSession)) {
        currentSession = sessionIds[sessionIds.length - 1];
        currentIndex = 0;
        goTo(0);
      }

      sessionsEl.innerHTML = '';

      const allPill = document.createElement('button');
      allPill.className = 'session-pill' + (currentSession === null ? ' active' : '');
      allPill.textContent = 'All';
      allPill.onclick = () => { hasUserSelectedSession = true; currentSession = null; currentIndex = 0; goTo(0); updateSessionPills(); };
      sessionsEl.appendChild(allPill);

      for (const s of sessionIds) {
        const pill = document.createElement('button');
        pill.className = 'session-pill' + (currentSession === s ? ' active' : '');
        // Numbers match feedback-round-N.md, so they skip a round whose mockups were all deleted or revised.
        const label = sessionLabels.get(`${currentWorkspace}:${s}`);
        pill.textContent = label ? `Round ${s} · ${label}` : `Round ${s}`;
        pill.onclick = () => {
          hasUserSelectedSession = true;
          currentSession = currentSession === s ? null : s;
          currentIndex = 0;
          goTo(0);
          updateSessionPills();
        };
        sessionsEl.appendChild(pill);
      }
    }

    window.addEventListener('message', e => {
      const frame=[...document.querySelectorAll('iframe[data-mockup-id]')].find(f=>f.contentWindow===e.source && f.dataset.mockupId===e.data?.id);
      if(!frame)return;
      const m=currentMockup();
      if(e.data.type==='mockup-resize') {
        const owner=mockups.find(mockup=>identity(mockup)===frame.closest('.slide')?.dataset.id);
        frame.dataset.naturalHeight=String(Math.max(100,Math.min(50000,e.data.height)));
        if(!briefs.get(owner?.workspace)?.viewport?.height)frame.style.height=frame.dataset.naturalHeight+'px';
        if(fitMode)applyFitScale();
      } else if(m && e.data.type==='review-key' && !recording) {
        if(e.data.key==='ArrowLeft')navigate(-1);
        if(e.data.key==='ArrowRight')navigate(1);
        if(e.data.key==='ArrowUp')vote('up');
        if(e.data.key==='ArrowDown')vote('down');
      } else if(m && e.data.type==='review-scroll' && frame.dataset.mockupId===identity(m)) {
        m.scroll={x:e.data.x,y:e.data.y};
      } else if(m && e.data.type==='review-point' && pointMode && !compareMode) {
        const anchor=`[${String(e.data.region).slice(0,80)}: ${String(e.data.text).slice(0,120)}] `;
        m.notes=(m.notes?m.notes+'\n':'')+anchor;
        notesEl.value=m.notes;notesEl.focus();queueDraft(m);autoResize();
        pointMode=false;setPointMode();
      }
    });

    async function api(endpoint, body) {
      const response=await fetch(endpoint,{...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),signal:AbortSignal.timeout(5000)});
      const result=await response.json();
      if(!response.ok)throw new Error(result.error||`HTTP ${response.status}`);
      return result;
    }
    function setStatus(text, error = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", error);
    }
    function restoreDraft(m) {
      let local;
      try {
        local = JSON.parse(localStorage.getItem("de-review:" + draftKey(m)));
      } catch {}
      const saved = drafts.get(draftKey(m));
      const review = local && (!saved || local.clientUpdated > saved.clientUpdated) ? local : saved;
      if (review) {
        m.notes = review.notes || "";
        m.vote = review.vote || null;
        m.seen = review.seen === true;
      }
    }
    function markSeen(m) {
      if (m && initialized && !m.seen) {
        m.seen = true;
        queueDraft(m);
      }
    }
    function queueDraft(m) {
      m.clientUpdated = Date.now();
      m.pendingSave = true;
      const active = currentMockup();
      if (active && active !== m && draftKey(active) === draftKey(m)) {
        active.clientUpdated = m.clientUpdated;
        active.pendingSave = true;
      }
      const review = {
        id: m.id,
        revision: m.revision,
        notes: m.notes,
        vote: m.vote,
        seen: m.seen,
        clientUpdated: m.clientUpdated,
      };
      try {
        localStorage.setItem("de-review:" + draftKey(m), JSON.stringify(review));
      } catch {}
      const key = draftKey(m);
      clearTimeout(saveTimers.get(key));
      const queued = { ...m };
      saveTimers.set(
        key,
        setTimeout(
          () =>
            saveDraft(queued).catch((error) =>
              setStatus(`Autosave failed: ${error.message}; notes retained in this browser.`, true),
            ),
          250,
        ),
      );
    }
    async function saveDraft(m) {
      clearTimeout(saveTimers.get(draftKey(m)));
      const review = {
        id: m.id,
        revision: m.revision,
        notes: m.notes,
        vote: m.vote,
        seen: m.seen,
        clientUpdated: m.clientUpdated || Date.now(),
      };
      const saved = await api(`/workspace/${encodeURIComponent(m.workspace)}/draft`, review);
      drafts.set(draftKey(m), saved);
      if (review.clientUpdated === m.clientUpdated) m.pendingSave = false;
      const active = currentMockup();
      if (active && draftKey(active) === draftKey(m) && review.clientUpdated === active.clientUpdated)
        active.pendingSave = false;
    }
    function updateReviewBrief() {
      const brief = briefs.get(currentWorkspace) || {};
      $("review-question").textContent = [
        brief.question,
        brief.state ? `Initial state: ${brief.state}` : "",
      ]
        .filter(Boolean)
        .join(" · ");
      const requestedWidth =
        viewportEl.value === "auto" ? null : Number(viewportEl.value) || brief.viewport?.width;
      const width =
        requestedWidth ||
        (sideMode ? activeSlide()?.querySelector("iframe")?.getBoundingClientRect().width : null);
      for (const slide of carousel.children) {
        const owner = mockups.find(mockup => identity(mockup) === slide.dataset.id);
        const height = briefs.get(owner?.workspace)?.viewport?.height;
        const inner = slide.querySelector(".slide-inner");
        const frames = [...slide.querySelectorAll("iframe")];
        inner.style.width = width
          ? `${sideMode && slide === activeSlide() ? width * 2 + 16 : width}px`
          : "";
        inner.style.maxWidth = width ? "none" : "";
        for (const frame of frames) {
          frame.style.width = width ? `${width}px` : "100%";
          frame.style.height = height ? height + "px" : frame.dataset.naturalHeight ? frame.dataset.naturalHeight + "px" : "";
          frame.style.minHeight = height ? "0" : "";
        }
      }
    }
    function activeSlide() {
      const m = currentMockup();
      return m && [...carousel.children].find((slide) => slide.dataset.id === identity(m));
    }
    function closeComparison() {
      compareMode = false;
      sideMode = false;
      comparison = null;
      for (const content of carousel.querySelectorAll(".slide-content")) {
        content.classList.remove("side-by-side");
        content.querySelector(".comparison-frame")?.remove();
        const frame = content.querySelector("iframe");
        if (frame) frame.style.display = "block";
      }
      $("compare-btn").setAttribute("aria-pressed", "false");
      $("side-btn").setAttribute("aria-pressed", "false");
    }
    async function refreshReferences() {
      const m = currentMockup();
      if (!m) return;
      const generation = ++comparisonGeneration;
      try {
        const [{ revisions }, { archived }] = await Promise.all([
          api(
            `/workspace/${encodeURIComponent(m.workspace)}/revisions?mockup=${encodeURIComponent(m.id)}`,
          ),
          api(`/workspace/${encodeURIComponent(m.workspace)}/archive`),
        ]);
        if (generation !== comparisonGeneration || currentMockup() !== m) return;
        referenceEl.replaceChildren(new Option("Choose…", ""));
        if (pinned) referenceEl.add(new Option(`Pinned #${pinned.number} r${pinned.revision}`, "pin"));
        for (const revision of revisions.filter((r) => r.revision !== m.revision).reverse())
          referenceEl.add(
            new Option(
              `#${m.number} r${revision.revision} · round ${revision.round}`,
              String(revision.revision),
            ),
          );
        for (const entry of archived)
          referenceEl.add(
            new Option(
              `Archived #${entry.number} ${entry.label} r${entry.revision}`,
              `archived:${entry.id}:${entry.revision}`,
            ),
          );
        $("compare-btn").disabled = $("side-btn").disabled = true;
      } catch (error) {
        setStatus(error.message, true);
      }
    }
    async function loadReference() {
      const m = currentMockup();
      const value = referenceEl.value;
      closeComparison();
      if (!m || !value) return;
      const generation = ++comparisonGeneration;
      try {
        let target;
        if (value === "pin") target = pinned;
        else {
          const [, archivedId, archivedRevision] = value.split(":");
          const id = archivedId || m.id;
          const revision = archivedRevision || value;
          const r = await api(
            `/workspace/${encodeURIComponent(m.workspace)}/revision?mockup=${encodeURIComponent(id)}&revision=${revision}`,
          );
          const parsed = parseMockupHtml(r.html);
          target = { ...m, ...r, id, label: parsed.label, contentHtml: parsed.contentHtml };
          if (archivedId) {
            const { archived } = await api(`/workspace/${encodeURIComponent(m.workspace)}/archive`);
            target.number = archived.find((entry) => entry.id === archivedId)?.number;
          }
        }
        if (generation !== comparisonGeneration || currentMockup() !== m) return;
        comparison = target;
        const frame = document.createElement("iframe");
        frame.className = "comparison-frame";
        frame.setAttribute("sandbox", "allow-scripts");
        frame.dataset.mockupId = identity(target) + ":reference";
        frame.srcdoc = buildIframeSrc(target.contentHtml, frame.dataset.mockupId);
        frame.style.display = "none";
        activeSlide().querySelector(".slide-content").appendChild(frame);
        $("compare-btn").disabled = $("side-btn").disabled = false;
        updateReviewBrief();
        setStatus(
          `Reference: #${target.number} r${target.revision}. A/B keeps the same viewport width.`,
        );
      } catch (error) {
        setStatus(error.message, true);
      }
    }
    function toggleComparison(side = false) {
      if (!comparison || recording) return;
      if (side) {
        sideMode = !sideMode;
        compareMode = false;
      } else {
        compareMode = !compareMode;
        sideMode = false;
      }
      const content = activeSlide()?.querySelector(".slide-content");
      if (!content) return;
      const frame = content.querySelector("iframe"),
        other = content.querySelector(".comparison-frame");
      frame.style.display = compareMode ? "none" : "block";
      other.style.display = compareMode || sideMode ? "block" : "none";
      content.classList.toggle("side-by-side", sideMode);
      other.contentWindow?.postMessage(
        { type: "review-scroll", ...(currentMockup().scroll || {}) },
        "*",
      );
      $("compare-btn").setAttribute("aria-pressed", String(compareMode));
      $("side-btn").setAttribute("aria-pressed", String(sideMode));
      setStatus(
        compareMode
          ? `Viewing reference #${comparison.number} r${comparison.revision}; press A to return and review the current design.`
          : "Viewing current design.",
      );
      updateUI();
    }
    function setPointMode() {
      $("point-btn").setAttribute("aria-pressed", String(pointMode));
      for (const frame of document.querySelectorAll("iframe[data-mockup-id]"))
        frame.contentWindow?.postMessage({ type: "review-point-mode", enabled: pointMode }, "*");
      if (pointMode) setStatus("Click an element in the preview to anchor your note.");
    }
    $("pin-btn").onclick = () => {
      const m = currentMockup();
      if (!m) return;
      pinned = { ...m };
      setStatus(`Pinned #${m.number} r${m.revision}. Choose another design to compare.`);
      refreshReferences();
    };
    referenceEl.onchange = loadReference;
    $("compare-btn").onclick = () => toggleComparison();
    $("side-btn").onclick = () => toggleComparison(true);
    $("point-btn").onclick = () => {
      pointMode = !pointMode;
      setPointMode();
    };
    viewportEl.onchange = () => {
      updateReviewBrief();
      if (fitMode) applyFitScale();
    };

    // ── Init ─────────────────────────────────────
    (async () => {
      connectSSE();
      updateVoiceStatus();
      if (voiceEnabled) {
        notesEl.placeholder = 'Notes… (Tab to focus, Space to dictate)';
        await initAudio();
        connectSoniox();
      } else {
        document.querySelector('.sc-voice')?.remove();
      }
    })();
  </script>
</body>
</html>
